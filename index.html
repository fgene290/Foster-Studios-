<script>
const SUPABASE_URL = "https://dyexenkmuafnduxpnsxg.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_jNxP3HPA4__Y-5SKEpdS3g_-OI2wYmi";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function createAccount() {
  const email = document.getElementById("customer-email").value;
  const password = document.getElementById("customer-password").value
  const confirmpassword = document.getElementById("customer-confirmpassword").value;
  

  const { error } = await supabaseClient.auth.signUp(({
    email,
    password,
    confirmpassword
  }));

  document.getElementById("account-message").textContent =
    error ? error.message : "Account created. Check your email to confirm it.";
}

async function loginAccount() {
  const email = document.getElementById("customer-email").value;
  const password = document.getElementById("customer-password").value;
  const confirmpassword = document.getElementById("customer-confirmpassword").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password,
    confirmpassword 
  });

  document.getElementById("account-message").textContent =
    error ? error.message : "You are logged in successfully.";
}

async function logoutAccount() {
  const { error } = await supabaseClient.auth.signOut();

  document.getElementById("account-message").textContent =
    error ? error.message : "You have logged out.";
}
